name: Live model test

# Calls real model APIs (costs tokens or free-tier quota), so it only runs on
# demand or when the live smoke test itself changes. Each provider job needs its
# repository secret: GEMINI_API_KEY, OPENROUTER_API_KEY or ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'JSON list of providers to test: "gemini", "openrouter", "anthropic"'
        default: '["gemini"]'
      model:
        description: Model id override (empty = provider default)
        default: ""
      effort:
        description: Effort level (Claude only)
        default: low
  push:
    paths:
      - scripts/live_smoke.py
      - agentic_os/llm/**
      - .github/workflows/live-test.yml

jobs:
  live:
    name: live (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(inputs.providers || '["gemini"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[anthropic,gemini]"
      - name: Live smoke test
        env:
          LIVE_PROVIDER: ${{ matrix.provider }}
          GEMINI_SECRET: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_SECRET: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_INPUT: ${{ inputs.model }}
          EFFORT_INPUT: ${{ inputs.effort || 'low' }}
        run: |
          case "$LIVE_PROVIDER" in
            gemini)
              [ -n "$GEMINI_SECRET" ] || { echo "::error::GEMINI_API_KEY secret is not set"; exit 1; }
              export AGENTIC_OS_PROVIDER=gemini GEMINI_API_KEY="$GEMINI_SECRET"
              export AGENTIC_OS_MODEL="${MODEL_INPUT:-gemini-flash-latest}" ;;
            openrouter)
              [ -n "$OPENROUTER_SECRET" ] || { echo "::error::OPENROUTER_API_KEY secret is not set"; exit 1; }
              export AGENTIC_OS_PROVIDER=anthropic ANTHROPIC_BASE_URL=https://openrouter.ai/api
              export ANTHROPIC_AUTH_TOKEN="$OPENROUTER_SECRET" AGENTIC_OS_FALLBACKS=false
              export AGENTIC_OS_MODEL="${MODEL_INPUT:-openrouter/free}"
              case "$AGENTIC_OS_MODEL" in anthropic/*) export AGENTIC_OS_EFFORT="$EFFORT_INPUT" ;; *) export AGENTIC_OS_EFFORT="" ;; esac ;;
            anthropic)
              [ -n "$ANTHROPIC_SECRET" ] || { echo "::error::ANTHROPIC_API_KEY secret is not set"; exit 1; }
              export AGENTIC_OS_PROVIDER=anthropic ANTHROPIC_API_KEY="$ANTHROPIC_SECRET"
              export AGENTIC_OS_MODEL="${MODEL_INPUT:-claude-opus-5-5}" AGENTIC_OS_EFFORT="$EFFORT_INPUT" ;;
            *) echo "::error::Unknown provider $LIVE_PROVIDER"; exit 1 ;;
          esac
          python scripts/live_smoke.py
