name: Live Claude test

# Calls the real Claude API (costs tokens), so it only runs on demand or when
# the live smoke test itself changes. Uses the OPENROUTER_API_KEY secret when set
# (via OpenRouter's Anthropic-compatible endpoint), else ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id (empty = claude-opus-5-5, or anthropic/claude-opus-5.5 on OpenRouter)
        default: ""
      effort:
        description: Effort level
        default: low
  push:
    paths:
      - scripts/live_smoke.py
      - .github/workflows/live-test.yml

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[anthropic]"
      - name: Live smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_INPUT: ${{ inputs.model }}
          AGENTIC_OS_EFFORT: ${{ inputs.effort || 'low' }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "Using OpenRouter (Anthropic-compatible endpoint)"
            unset ANTHROPIC_API_KEY
            export ANTHROPIC_BASE_URL=https://openrouter.ai/api
            export ANTHROPIC_AUTH_TOKEN="$OPENROUTER_API_KEY"
            export AGENTIC_OS_FALLBACKS=false
            export AGENTIC_OS_MODEL="${MODEL_INPUT:-anthropic/claude-opus-5.5}"
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "Using the Anthropic API"
            export AGENTIC_OS_MODEL="${MODEL_INPUT:-claude-opus-5-5}"
          else
            echo "::error::Set the OPENROUTER_API_KEY or ANTHROPIC_API_KEY repository secret"; exit 1
          fi
          python scripts/live_smoke.py
