name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,anthropic]"
      - run: ruff check .
      - run: pytest -q
      - name: Run examples offline
        env:
          AGENTIC_OS_PROVIDER: mock
        run: for f in examples/*.py; do python "$f" > /dev/null; done
